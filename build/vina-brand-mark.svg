<svg xmlns="http://www.w3.org/2000/svg" width="37" height="30" viewBox="-3 -3 37 30">
  <view id="mark" viewBox="0 0 31 24"/>
  <style>
    .upper-left { fill: #555555; }
    .upper-right { fill: #A7A7A7; }
    .lower-right { fill: #313131; }
    .lower-left { fill: #0E0E0E; }
    .center { fill: #000000; }

    @media (prefers-color-scheme: dark) {
      .upper-left { fill: #AAAAAA; }
      .upper-right { fill: #585858; }
      .lower-right { fill: #CECECE; }
      .lower-left { fill: #F1F1F1; }
      .center { fill: #FFFFFF; }
    }

    /* Opt in for startup. The sidebar and new-session heading use the static view. */
    @media (prefers-reduced-motion: no-preference) {
      #startup:target .upper-left { --spread: translate(-1.3px, -1.1px); }
      #startup:target .upper-right { --spread: translate(1.3px, -1.1px); }
      #startup:target .lower-left { --spread: translate(-.8px, 1px); }
      #startup:target .lower-right { --spread: translate(.8px, 1px); }
      #startup:target path { animation: settle 2.8s ease-in-out infinite; }
      #startup:target .center {
        --spread: scale(1.16);
        transform-box: fill-box;
        transform-origin: center;
      }
    }

    @keyframes settle {
      0%, 16%, 76%, 100% { transform: none; }
      44% { transform: var(--spread); }
    }
  </style>
