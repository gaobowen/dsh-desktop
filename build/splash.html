<!doctype html>
<html lang="en" data-dsh-hide-caption-menu>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VinaHarness</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: light-dark(#fbfbfb, #151618);
        color: light-dark(#17181a, #f4f4f5);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 32px;
      }
      .markFrame { display: grid; justify-items: center; gap: 12px; width: 100%; transform: translateY(-32px); }
      .mark { display: block; width: min(96px, 100%); height: auto; }
      .wordmark { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.035em; }
    </style>
  </head>
  <body>
    <main>
      <div class="markFrame">
        <img class="mark" src="vina-brand-mark.svg#startup" width="96" height="78" alt="" />
        <h1 class="wordmark">VinaHarness</h1>
      </div>
    </main>
  </body>
</html>
